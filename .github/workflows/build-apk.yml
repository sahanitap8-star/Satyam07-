name: Build ARIA AI APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0 or 1.0.1)'
        required: true
        default: '1.0.0'
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Clean and Build Debug APK with Gradle
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Locate and Verify APK
        id: locate_apk
        run: |
          echo "=== Searching for generated APK files in android/app/build/outputs ==="
          find android/app/build/outputs -type f -name "*.apk" -print

          # Dynamically locate the actual generated debug APK
          FOUND_APK=$(find android/app/build/outputs -type f -name "*debug*.apk" | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find android/app/build/outputs -type f -name "*.apk" | head -n 1)
          fi

          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "::error::No APK file found in android/app/build/outputs!"
            echo "Listing all contents in android/app/build:"
            find android/app/build -maxdepth 4 -ls || true
            exit 1
          fi

          echo "Found APK: $FOUND_APK"
          test -f "$FOUND_APK" || { echo "::error::File test verification failed for $FOUND_APK"; exit 1; }

          echo "apk_path=$FOUND_APK" >> $GITHUB_OUTPUT
          echo "APK_PATH=$FOUND_APK" >> $GITHUB_ENV
          echo "Verified APK path successfully registered: $FOUND_APK"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-ai-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Determine Version Tag
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          else
            RAW_VERSION="1.0.${{ github.run_number }}"
          fi
          if [[ $RAW_VERSION == v* ]]; then
            TAG="$RAW_VERSION"
          else
            TAG="v$RAW_VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$RAW_VERSION" >> $GITHUB_OUTPUT

      - name: Create GitHub Release & Upload APK
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.versioning.outputs.tag }}
          name: ARIA AI ${{ steps.versioning.outputs.tag }}
          body: |
            ## ARIA AI Android Debug APK
            **Version:** `${{ steps.versioning.outputs.tag }}`
            **Build Run:** `#${{ github.run_number }}`
            **Commit:** `${{ github.sha }}`

            ### Direct APK Download
            Download the attached **`app-debug.apk`** from the Assets section below.
          files: |
            ${{ steps.locate_apk.outputs.apk_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}


