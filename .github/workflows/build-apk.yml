name: Build ARIA AI APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.8)'
        required: true
        default: '1.0.8'
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java Development Kit (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Clean and Build Debug APK with Gradle
        working-directory: android
        run: |
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses 2>/dev/null || true
          gradle clean assembleDebug --stacktrace


      - name: Locate and Verify APK
        id: locate_apk
        run: |
          echo "=== Searching for generated APK files across entire workspace ==="
          find . -type f -name "*.apk" -print

          FOUND_APK=$(find android/app/build -type f -name "*debug*.apk" 2>/dev/null | head -n 1)
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find . -type f -name "*debug*.apk" 2>/dev/null | head -n 1)
          fi
          if [ -z "$FOUND_APK" ]; then
            FOUND_APK=$(find . -type f -name "*.apk" 2>/dev/null | head -n 1)
          fi

          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "::error::Gradle did not generate an APK or file was not found!"
            echo "=== Listing android/app directory structure ==="
            find android/app -maxdepth 5 -ls || true
            exit 1
          fi

          # Strip leading ./ if present for consistent pathing
          CLEAN_PATH=$(echo "$FOUND_APK" | sed 's|^\./||')
          echo "Found APK: $CLEAN_PATH"
          test -f "$CLEAN_PATH" || { echo "::error::File test verification failed for $CLEAN_PATH"; exit 1; }

          echo "apk_path=$CLEAN_PATH" >> $GITHUB_OUTPUT
          echo "APK_PATH=$CLEAN_PATH" >> $GITHUB_ENV
          echo "Verified APK path successfully registered: $CLEAN_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-ai-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Determine Version Tag
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          else
            RAW_VERSION="1.0.${{ github.run_number }}"
          fi
          if [[ $RAW_VERSION == v* ]]; then
            TAG="$RAW_VERSION"
          else
            TAG="v$RAW_VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$RAW_VERSION" >> $GITHUB_OUTPUT

      - name: Duplicate Tag Protection
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists. Use a new version."
            exit 1
          fi
          echo "Tag $TAG is available for release."

      - name: Create GitHub Release and Upload APK Asset
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          APK_FILE="${{ steps.locate_apk.outputs.apk_path }}"

          echo "Creating GitHub Release $TAG and uploading $APK_FILE..."
          gh release create "$TAG" \
            "$APK_FILE" \
            --title "ARIA AI $TAG" \
            --notes "ARIA AI Android Debug APK
          Version: $TAG
          Build: ${{ github.run_number }}
          Commit: ${{ github.sha }}"

      - name: Verify Release Assets
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          echo "=== Verifying GitHub Release Assets for $TAG ==="
          RELEASE_INFO=$(gh release view "$TAG" --json url,tagName,name,assets)
          echo "$RELEASE_INFO"

          if ! echo "$RELEASE_INFO" | grep -q "app-debug.apk"; then
            echo "::error::app-debug.apk is NOT present in the Release assets!"
            exit 1
          fi

          echo "=== Success: app-debug.apk is verified in GitHub Release assets ==="
          RELEASE_URL=$(echo "$RELEASE_INFO" | jq -r '.url // empty')
          echo "Release URL: $RELEASE_URL"



