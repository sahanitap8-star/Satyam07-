name: Build ARIA AI APK

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.8)'
        required: true
        default: '1.0.8'
        type: string
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    name: Build Android Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Executable
        run: chmod +x android/gradlew

      - name: Clean and Build Debug APK with Gradle
        working-directory: android
        run: |
          ./gradlew clean
          ./gradlew assembleDebug --stacktrace

      - name: Locate and Verify APK
        id: locate_apk
        run: |
          echo "=== Searching for generated APK files in android ==="
          find android -type f -name "*.apk" -print

          EXPECTED_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ -f "$EXPECTED_APK" ]; then
            FOUND_APK="$EXPECTED_APK"
          else
            FOUND_APK=$(find android -type f -name "*debug*.apk" | head -n 1)
            if [ -z "$FOUND_APK" ]; then
              FOUND_APK=$(find android -type f -name "*.apk" | head -n 1)
            fi
          fi

          if [ -z "$FOUND_APK" ] || [ ! -f "$FOUND_APK" ]; then
            echo "::error::APK build failed or output APK not found!"
            echo "Listing all contents in android/app/build:"
            find android/app/build -maxdepth 4 -ls || true
            exit 1
          fi

          test -f "$FOUND_APK" || { echo "::error::File test verification failed for $FOUND_APK"; exit 1; }

          echo "Found verified APK: $FOUND_APK"
          echo "apk_path=$FOUND_APK" >> $GITHUB_OUTPUT
          echo "APK_PATH=$FOUND_APK" >> $GITHUB_ENV

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aria-ai-debug-apk
          path: ${{ steps.locate_apk.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 30

      - name: Determine Version Tag
        id: versioning
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.version }}"
          else
            RAW_VERSION="1.0.${{ github.run_number }}"
          fi
          if [[ $RAW_VERSION == v* ]]; then
            TAG="$RAW_VERSION"
          else
            TAG="v$RAW_VERSION"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$RAW_VERSION" >> $GITHUB_OUTPUT

      - name: Duplicate Tag Protection
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Release tag $TAG already exists. Use a new version."
            exit 1
          fi
          echo "Tag $TAG is available for release."

      - name: Create GitHub Release and Upload APK Asset
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          APK_FILE="${{ steps.locate_apk.outputs.apk_path }}"

          echo "Creating GitHub Release $TAG and uploading $APK_FILE..."
          gh release create "$TAG" \
            "$APK_FILE" \
            --title "ARIA AI $TAG" \
            --notes "ARIA AI Android Debug APK
          Version: $TAG
          Build: ${{ github.run_number }}
          Commit: ${{ github.sha }}"

      - name: Verify Release Assets
        if: ${{ github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.versioning.outputs.tag }}"
          echo "=== Verifying GitHub Release Assets for $TAG ==="
          RELEASE_INFO=$(gh release view "$TAG" --json url,tagName,name,assets)
          echo "$RELEASE_INFO"

          if ! echo "$RELEASE_INFO" | grep -q "app-debug.apk"; then
            echo "::error::app-debug.apk is NOT present in the Release assets!"
            exit 1
          fi

          echo "=== Success: app-debug.apk is verified in GitHub Release assets ==="
          RELEASE_URL=$(echo "$RELEASE_INFO" | jq -r '.url // empty')
          echo "Release URL: $RELEASE_URL"



